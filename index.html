<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>PyRun — онлайн Python</title>
<meta name="description" content="Красивый онлайн-компилятор Python: запуск кода прямо в браузере, без установки.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
:root{--bg:#0b0d10;--card:rgba(22,26,32,.85);--card2:rgba(34,40,49,.9);--line:rgba(255,255,255,.08);--text:#eef2f7;--dim:#8d97a5;--accent:#6ea8ff;--green:#5bd08d;--red:#ff7a7a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(700px 380px at 20% 0%,rgba(110,168,255,.10),transparent 70%),radial-gradient(500px 320px at 85% 90%,rgba(140,110,255,.08),transparent 70%);pointer-events:none}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:12px 16px;flex:none;flex-wrap:wrap}
#top .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
#top .logo .badge{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(160deg,rgba(110,168,255,.25),rgba(110,168,255,.05));border:1px solid rgba(110,168,255,.3);font-size:17px}
#top .sub{color:var(--dim);font-size:12.5px}
#top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:10px 18px;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .12s,filter .12s;white-space:nowrap}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn svg{width:16px;height:16px}
#status{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:7px;white-space:nowrap}
#status .dot{width:8px;height:8px;border-radius:99px;background:#c9a44d;box-shadow:0 0 10px rgba(201,164,77,.8)}
#status.on .dot{background:var(--green);box-shadow:0 0 10px rgba(91,208,141,.8)}

#main{flex:1;display:flex;min-height:0;padding:0 16px 16px;gap:14px}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;backdrop-filter:blur(14px);box-shadow:0 16px 44px rgba(0,0,0,.35)}
.pane .phead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.pane .phead .t{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.3px}
.pane .phead .spacer{flex:1}
.chip{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:rgba(255,255,255,.03);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--text)}
select.chip{appearance:auto;color:var(--text);font-size:12px;padding:3px 8px}
#editorwrap{flex:1;min-height:0;position:relative}
.CodeMirror{height:100%;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;background:transparent!important;color:#eef2f7}
.cm-s-material-darker .CodeMirror-gutters{background:rgba(255,255,255,.02);border-right:1px solid var(--line)}
.cm-s-material-darker .CodeMirror-cursor{border-left:2px solid var(--accent)}

#outwrap{flex:1;min-height:0;overflow:auto;padding:12px 14px;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#outwrap .err{color:var(--red)}
#outwrap .dim{color:var(--dim)}
#outwrap .ok{color:var(--green)}
#outwrap:empty::before{content:"Вывод появится здесь";color:var(--dim);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13.5px}

#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);z-index:50;transition:opacity .4s;padding:24px;text-align:center}
#load.hidden{opacity:0;pointer-events:none}
#load .py{font-size:44px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#load h1{font-size:21px;font-weight:700}
#load p{color:var(--dim);font-size:14px;max-width:380px}
#load .bar{width:min(320px,80vw);height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
#load .bar i{display:block;height:100%;width:8%;border-radius:99px;background:linear-gradient(90deg,#6ea8ff,#8c6eff);transition:width .5s}

@media(max-width:760px){
 #main{flex-direction:column;padding:0 10px 10px;gap:10px}
 .pane{border-radius:14px}
 #top{padding:10px 12px}
 .sub{display:none}
 #outPane{flex:0 0 40%}
}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <div class="logo"><span class="badge">🐍</span>PyRun<span class="sub">онлайн Python</span></div>
  <div class="spacer"></div>
  <select id="examples" class="chip"><option value="">Примеры…</option></select>
  <button class="btn ghost" id="shareBtn" title="Скопировать ссылку с кодом">Ссылка</button>
  <div id="status"><span class="dot"></span><span id="statusText">загрузка…</span></div>
  <button class="btn" id="runBtn" disabled>
   <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Запустить
  </button>
 </div>
 <div id="main">
  <div class="pane" id="editPane">
   <div class="phead"><span class="t">КОД</span><div class="spacer"></div><span class="chip" id="clearBtn">очистить</span></div>
   <div id="editorwrap"><textarea id="code"></textarea></div>
  </div>
  <div class="pane" id="outPane">
   <div class="phead"><span class="t">ВЫВОД</span><div class="spacer"></div><span class="chip" id="clearOutBtn">очистить вывод</span></div>
   <div id="outwrap"></div>
  </div>
 </div>
</div>

<div id="load">
 <div class="py">🐍</div>
 <h1>PyRun</h1>
 <p>Python запускается прямо в браузере. Первый запуск скачает движок (~10 МБ), дальше — мгновенно.</p>
 <div class="bar"><i id="bar"></i></div>
 <p id="loadpct" style="font-size:12.5px">загружаю…</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const EXAMPLES = {
 "Привет, мир": 'name = input("Как тебя зовут? ")\nprint(f"Привет, {name}! 🐍")',
 "Числа Фибоначчи": "def fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        print(a, end=' ')\n        a, b = b, a + b\n    print()\n\nfib(15)",
 "Списки и срезы": "nums = [8, 3, 15, 1, 42, 7]\nprint(\"было:\", nums)\nnums.sort()\nprint(\"стало:\", nums)\nprint(\"топ-3:\", nums[-3:])",
 "Счётчик букв": "from collections import Counter\ns = \"онлайн компилятор пайтон\"\nc = Counter(s.replace(\" \", \"\"))\nfor ch, n in c.most_common(5):\n    print(f\"{ch!r}: {n}\")",
 "Классы": "class Drone:\n    def __init__(self, model, battery=100):\n        self.model = model\n        self.battery = battery\n    def fly(self, minutes):\n        self.battery = max(0, self.battery - minutes * 2)\n        return f\"{self.model} летит {minutes} мин, заряд {self.battery}%\"\n\nd = Drone(\"Cetus Pro\")\nprint(d.fly(20))",
 "Математика": "import math, random\nrolls = [random.randint(1, 6) for _ in range(1000)]\nprint(\"среднее за 1000 бросков кубика:\", round(sum(rolls) / len(rolls), 3))\nprint(\"√2 =\", math.sqrt(2))\nprint(\"π =\", round(math.pi, 5))",
 "NumPy": "import numpy as np\na = np.array([[1, 2, 3], [4, 5, 6]])\nprint(a * 2)\nprint(\"строк:\", a.shape[0], \"столбцов:\", a.shape[1])\nprint(\"сумма:\", a.sum())"
};

const sel = document.getElementById('examples');
for (const k of Object.keys(EXAMPLES)) {
  const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o);
}

const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
  mode: 'python', theme: 'material-darker', lineNumbers: true, indentUnit: 4,
  matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true, lineWrapping: true,
  extraKeys: {'Ctrl-Enter': run, 'Cmd-Enter': run, 'Shift-Enter': run}
});

try {
  const h = location.hash.slice(1);
  if (h) editor.setValue(decodeURIComponent(escape(atob(h.replace(/-/g, '+').replace(/_/g, '/')))));
} catch(e) {}
if (!editor.getValue()) editor.setValue(`# Пиши код и жми Запустить (Ctrl+Enter)\n# Работают input(), NumPy, pandas и многое другое\n\nimport sys\nprint("Python", sys.version.split()[0])\nprint("Считаем от 1 до 5:", list(range(1, 6)))\n`);

const out = document.getElementById('outwrap');
const bar = document.getElementById('bar'), loadpct = document.getElementById('loadpct');
const status = document.getElementById('status'), statusText = document.getElementById('statusText');
const runBtn = document.getElementById('runBtn');
let py = null, pyVersion = '', running = false;

function println(text, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}

let pv = 0;
const pTimer = setInterval(() => { pv = Math.min(92, pv + 2); bar.style.width = pv + '%'; loadpct.textContent = pv + '%'; }, 350);

async function boot() {
  try {
    py = await loadPyodide({
      indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/',
      stdout: (s) => println(s),
      stderr: (s) => println(s, 'err')
    });
    py.setStdin({ stdin: () => (prompt('input() ждёт ввода:') ?? '') + '\n' });
    clearInterval(pTimer);
    bar.style.width = '100%'; loadpct.textContent = '100%';
    pyVersion = py.runPython('import sys\nsys.version.split()[0]').toString();
    document.getElementById('load').classList.add('hidden');
    runBtn.disabled = false;
    status.classList.add('on');
    statusText.textContent = 'Python ' + pyVersion + ' готов';
  } catch (e) {
    clearInterval(pTimer);
    loadpct.textContent = 'не удалось загрузить: ' + e;
  }
}

async function run() {
  if (!py || running) return;
  running = true;
  runBtn.disabled = true;
  const t0 = performance.now();
  println('── запуск ──', 'dim');
  try {
    const code = editor.getValue();
    await py.loadPackagesFromImports(code);
    const r = await py.runPythonAsync(code);
    if (r !== undefined) println(py.globals.get('repr')(r).toString(), 'ok');
    println(`── готово за ${Math.round(performance.now() - t0)} мс ──`, 'dim');
  } catch (e) {
    println(String(e).split('\n').filter(l => l).join('\n'), 'err');
  }
  running = false;
  runBtn.disabled = false;
}

runBtn.onclick = run;
document.getElementById('clearOutBtn').onclick = () => out.innerHTML = '';
document.getElementById('clearBtn').onclick = () => { editor.setValue(''); editor.focus(); };
sel.onchange = () => { if (EXAMPLES[sel.value]) { editor.setValue(EXAMPLES[sel.value]); editor.focus(); sel.value = ''; } };
document.getElementById('shareBtn').onclick = () => {
  const code = btoa(unescape(encodeURIComponent(editor.getValue()))).replace(/\+/g, '-').replace(/\//g, '_');
  const url = location.origin + location.pathname + '#' + code;
  navigator.clipboard.writeText(url).then(() => flash('ссылка скопирована'), () => { location.hash = code; flash('ссылка в адресной строке'); });
};
function flash(msg) {
  statusText.textContent = msg;
  setTimeout(() => { statusText.textContent = 'Python ' + pyVersion + ' готов'; }, 1800);
}
boot();
</script>
</body>
</html>
